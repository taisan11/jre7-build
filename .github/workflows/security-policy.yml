name: Validate Java 7 security policy

on:
  pull_request:
    paths:
      - 'patches/security/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/security-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-security-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run offline regression tests
        run: |
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -v

      - name: Check patch against pinned OpenJDK 7u351
        run: |
          bash scripts/fetch-source.sh jdk7u351-ga
          bash scripts/apply-patches.sh work/openjdk
          grep -Fx '0164D7CEAE5BB909C272AF151FF44B1177AE9B47D9424B94F1D9558C30934D19' \
            work/openjdk/jdk/src/share/lib/security/blacklisted.certs
          grep -F 'ECDH, include jdk.disabled.namedCurves' \
            work/openjdk/jdk/src/share/lib/security/java.security-linux
