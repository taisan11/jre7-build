name: Build legacy OpenJDK 7 (Windows x64 experiment)

# Manually dispatched: the legacy Windows SDK build remains experimental.
on:
  workflow_dispatch:
  # Temporary validation trigger for this fix branch; keep main manual-only.
  push:
    branches:
      - fix/windows-native-deps-20261101

permissions:
  contents: read

concurrency:
  group: jre7-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Verify scripts and CA parser tests
        shell: pwsh
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Python validation failed' }

      - name: Clone pinned OpenJDK 7u source and apply patches
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/fetch-source.sh jdk7u351-ga
          bash scripts/apply-patches.sh work/openjdk

      - name: Fetch Mozilla CA bundle
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://curl.se/ca/cacert.pem' -OutFile 'work/cacert.pem'
          $digest = (Get-FileHash 'work/cacert.pem' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  cacert.pem" | Set-Content -Path 'work/cacert.sha256' -Encoding ascii
          python scripts/cacerts.py --bundle work/cacert.pem --check-only
          if ($LASTEXITCODE -ne 0) { throw 'CA bundle check failed' }

      - name: Install Windows SDK 7.1, legacy bootstrap, Cygwin and Ant
        shell: pwsh
        run: ./scripts/windows/setup-toolchain.ps1

      - name: Fetch legacy DirectX SDK and FreeType sources
        shell: pwsh
        run: ./scripts/windows/setup-native-deps.ps1

      - name: Build OpenJDK 7 Windows x64 (experimental SDK 7.1)
        shell: cmd
        env:
          BUILD_JOBS: '1'
        run: scripts\windows\run-build.cmd

      - name: Smoke test completed JDK image
        shell: pwsh
        run: |
          $jdk = (Get-Content 'work/windows-jdk-image.txt' -Raw).Trim()
          $smokeDir = Join-Path (Resolve-Path 'work').Path 'smoke'
          New-Item -ItemType Directory -Force $smokeDir | Out-Null
          & (Join-Path $jdk 'bin\javac.exe') -source 7 -target 7 -d $smokeDir tests/SmokeTest.java
          if ($LASTEXITCODE -ne 0) { throw 'javac smoke test failed' }
          & (Join-Path $jdk 'bin\java.exe') -Djava.awt.headless=true -cp $smokeDir SmokeTest
          if ($LASTEXITCODE -ne 0) { throw 'Java 7 smoke test failed' }

      - name: Create Windows JRE / JDK ZIP and JKS cacerts
        shell: pwsh
        run: ./scripts/windows/package.ps1

      - name: Upload native Windows x64 ZIPs and SHA256 hashes
        uses: actions/upload-artifact@v4
        with:
          name: legacy-openjdk7u351-windows-x64
          path: |
            out/legacy-openjdk7u351-windows-x64-*.zip
            out/legacy-openjdk7u351-windows-x64-*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-diagnostics
          path: |
            work/logs/**
            work/applied-patches.txt
            work/upstream-commit.txt
          if-no-files-found: warn
          retention-days: 7
